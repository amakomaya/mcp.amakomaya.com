[project]
name = "digital-health-mcp-server"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server that lets a pregnant woman log in with Keycloak and get a plain-language summary of her own FHIR pregnancy care record."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Md Abid Hasan" }]
keywords = ["fhir", "hapi-fhir", "keycloak", "pregnancy", "maternal-health", "mcp", "model-context-protocol", "health-information-systems", "claude", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "mcp>=1.2.0,<2.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
digital-health-mcp = "digital_health_mcp.server:main"

[project.urls]
Homepage = "https://github.com/ahasan722/dhis2-mcp-server"
Repository = "https://github.com/ahasan722/dhis2-mcp-server"
Issues = "https://github.com/ahasan722/dhis2-mcp-server/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digital_health_mcp"]

[tool.ruff]
line-length = 88
target-version = "py310"
